# 合璧OS HeBi OS — GRUB 配置
set default=0
set timeout=5
set fallback=1

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

loadfont ($root)/boot/grub/theme/HeBiSans-Bold-44.pf2
loadfont ($root)/boot/grub/theme/HeBiSans-24.pf2
loadfont ($root)/boot/grub/theme/HeBiSans-18.pf2
theme=($root)/boot/grub/theme/theme.txt

menuentry "合璧OS 5.0 — 体验模式 (Live)" --class hebios --id hebios-live {
    linux /boot/vmlinuz root=/dev/ram0 rw console=tty0 console=ttyS0,115200 \
        vga=791 vt.handoff=1 quiet ignore_loglevel nowatchdog
    initrd /boot/initrd.gz
}

menuentry "合璧OS 5.0 — 图形化安装 (Install)" --class hebios --id hebios-install {
    linux /boot/vmlinuz root=/dev/ram0 rw console=tty0 \
        vga=791 vt.handoff=1 hebi.install=1 quiet ignore_loglevel nowatchdog
    initrd /boot/initrd.gz
}

menuentry "合璧OS 5.0 — 网页安装 (HTML Web Install)" --class hebios --id hebios-webinst {
    linux /boot/vmlinuz root=/dev/ram0 rw console=tty0 console=ttyS0,115200 \
        vga=791 vt.handoff=1 hebi.webinst=1 quiet ignore_loglevel nowatchdog
    initrd /boot/initrd.gz
}

menuentry "合璧OS 5.0 — 安全图形模式 (Safe Graphics)" --class hebios {
    linux /boot/vmlinuz root=/dev/ram0 rw console=tty0 console=ttyS0,115200 nomodeset nowatchdog
    initrd /boot/initrd.gz
}

menuentry "合璧OS 5.0 — 固件修复模式 (Firmware Repair)" --class hebios {
    linux /boot/vmlinuz root=/dev/ram0 rw console=tty0 \
        vga=791 vt.handoff=1 hebi.repair=1 quiet ignore_loglevel nowatchdog
    initrd /boot/initrd.gz
}

menuentry "从本地磁盘启动 (Boot from Local Disk)" --class other {
    set root=(hd0)
    chainloader +1
}

if [ x$platform = xpc ]; then
    menuentry "UEFI 固件设置 (UEFI Firmware Settings)" --id uefi-firmware {
        fwsetup
    }
fi
